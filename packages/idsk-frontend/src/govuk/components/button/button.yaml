params:
  - name: element
    type: string
    required: false
    description: HTML element for the button component – `input`, `button` or `a`. In most cases you will not need to set this as it will be configured automatically if `href` is provided. This parameter will be removed in the next major version.
  - name: text
    type: string
    required: true
    description: If `html` is set, this is not required. Text for the `input`, `button` or `a` element. If `html` is provided, the `text` option will be ignored and `element` will be automatically set to `"button"` unless `href` is also set, or it has already been defined.
  - name: html
    type: string
    required: true
    description: If `text` is set, this is not required. HTML for the `button` or `a` element only. If `html` is provided, the `text` option will be ignored and `element` will be automatically set to `"button"` unless `href` is also set, or it has already been defined. This option has no effect if `element` is set to `"input"`.
  - name: name
    type: string
    required: false
    description: Name for the `input` or `button`. This has no effect on `a` elements.
  - name: type
    type: string
    required: false
    description: Type for the `input` or `button` element – `"button"`, `"submit"` or `"reset"`. Defaults to `"submit"`. This has no effect on `a` elements.
  - name: value
    type: string
    required: false
    description: Value for the `button` element only. This has no effect on `a` or `input` elements.
  - name: disabled
    type: boolean
    required: false
    description: Whether the button component should be disabled. For `input` and `button` elements, `disabled` and `aria-disabled` attributes will be set automatically. This has no effect on `a` elements.
  - name: href
    type: string
    required: false
    description: The URL that the button component should link to. If this is set, `element` will be automatically set to `"a"` if it has not already been defined.
  - name: classes
    type: string
    required: false
    description: Classes to add to the button component.
  - name: attributes
    type: object
    required: false
    description: HTML attributes (for example data attributes) to add to the button component.
  - name: preventDoubleClick
    type: boolean
    required: false
    description: Prevent accidental double clicks on submit buttons from submitting forms multiple times.
  - name: isStartButton
    type: boolean
    required: false
    description: Use for the main call to action on your service's start page.
  - name: id
    type: string
    required: false
    description: The ID of the button.

title: Tlačidlo
examples:
  # --- 1. PRIMÁRNE TLAČIDLÁ ---
  - name: primárne
    description: Základné primárne tlačidlo pre hlavnú akciu na stránke.
    options:
      text: Primárne tlačidlo
      classes: govuk-button__basic

  - name: primárne úspešné
    options:
      text: Súhlasím
      classes: govuk-button__success

  # --- 2. SEKUNDÁRNE TLAČIDLÁ ---
  - name: sekundárne
    description: Tlačidlo pre vedľajšie akcie (napríklad Zrušiť, Späť).
    options:
      text: Sekundárne tlačidlo
      classes: govuk-button--sec

  - name: sekundárne úspešné
    options:
      text: Sekundárne úspešné
      classes: govuk-button--sec govuk-button--sec__success

  - name: sekundárne upozorňovacie
    options:
      text: Sekundárne upozorňovacie
      classes: govuk-button--sec govuk-button--sec__warning

  # --- 3. TERCIÁRNE (TEXTOVÉ) TLAČIDLÁ ---
  - name: terciárne (textové)
    description: Tlačidlo bez orámovania, vhodné pre menej dôležité akcie.
    options:
      text: Textové tlačidlo
      classes: govuk-button--texted

  - name: terciárne úspešné
    options:
      text: Textové úspešné
      classes: govuk-button--texted govuk-button--texted__success

  - name: terciárne upozorňovacie
    options:
      text: Textové upozorňovacie
      classes: govuk-button--texted govuk-button--texted__warning

  # --- 4. TLAČIDLÁ S IKONAMI ---
  - name: s ikonou naľavo
    description: Využíva parameter `html` pre vloženie ikony pred text.
    options:
      html: <span class="material-icons" aria-hidden="true">arrow_back</span> <span>Naspäť</span>
      classes: govuk-button__basic

  - name: s ikonou napravo
    description: Využíva parameter `html` pre vloženie ikony za text.
    options:
      html: <span>Pokračovať</span> <span class="material-icons" aria-hidden="true">arrow_forward</span>
      classes: govuk-button__basic

  - name: s ikonami na oboch stranách
    options:
      html: <span class="material-icons" aria-hidden="true">add</span> <span>Pridať položku</span> <span class="material-icons" aria-hidden="true">check</span>
      classes: govuk-button__basic

  - name: iba ikona
    description: Tlačidlo obsahujúce iba ikonu. Obsahuje `aria-label` pre čítačky obrazoviek.
    options:
      html: <span class="material-icons" aria-hidden="true">close</span>
      classes: govuk-button--sec govuk-button--sec__warning
      attributes:
        aria-label: Zavrieť

  # --- 5. VEĽKOSTI TLAČIDIEL ---
  - name: stredné (medium)
    description: Tlačidlo so zmenšeným vertikálnym odsadením.
    options:
      text: Stredné tlačidlo
      classes: govuk-button__basic govuk-button__medium

  - name: malé (small)
    description: Kompaktné tlačidlo pre použitie v stiesnených priestoroch (napr. tabuľky).
    options:
      text: Malé tlačidlo
      classes: govuk-button__basic govuk-button__small

  # --- 6. ŠPECIFICKÉ STAVY A ELEMENTY ---
  - name: zamerané (focus)
    description: Ukážka stavu pri zameraní prvku klávesnicou (simuluje :focus pseudotriedu). Tento vizuál je kľúčový pre prístupnosť (a11y).
    options:
      text: Zamerané tlačidlo
      classes: govuk-button__basic :focus

  - name: zakázané (disabled)
    description: Používa sa, ak akcia momentálne nie je pre používateľa dostupná.
    options:
      text: Odoslať
      classes: govuk-button__basic
      disabled: true

  - name: ako odkaz (link)
    description: Ak je zadaný parameter `href`, komponent sa automaticky vyrenderuje ako `<a>` tag.
    options:
      text: Prejsť na úvodnú stránku
      classes: govuk-button__basic
      href: '#'
