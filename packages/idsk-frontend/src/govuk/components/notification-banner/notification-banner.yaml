params:
  - name: text
    type: string
    required: true
    description: The text that displays in the notification banner. You can use any string with this option. If you set `html`, this option is not required and is ignored.
  - name: html
    type: string
    required: true
    description: The HTML to use within the notification banner. You can use any string with this option. If you set `html`, `text` is not required and is ignored.
  - name: caller
    type: nunjucks-block
    required: false
    description: Not strictly a parameter but Nunjucks code convention. Using a `call` block enables you to call a macro with all the text inside the tag.
  - name: titleText
    type: string
    required: false
    description: |
      The title text that displays in the notification banner. You can use any string with this option. Use this option to set text that does not contain HTML. The available default values are 'Important', 'Success', 'Warning', 'Error' and null:
      - if you do not set `type`, `titleText` defaults to `"Important"`
      - if you set `type` to `success`, `titleText` defaults to `"Success"`
      - if you set `type` to `warning`, `titleText` defaults to `"Warning"`
      - if you set `type` to `alert`, `titleText` defaults to `"Error"`
      - if you set `titleHtml`, this option is ignored
  - name: titleHtml
    type: string
    required: false
    description: The title HTML to use within the notification banner. You can use any string with this option. Use this option to set text that contains HTML. If you set `titleHtml`, the `titleText` option is ignored.
  - name: titleHeadingLevel
    type: string
    required: false
    description: Sets heading level for the title only. You can only use values between `1` and `6` with this option. The default is `2`.
  - name: type
    type: string
    required: false
    description: The type of notification to render. You can use `"success"`, `"warning"`, `"alert"` or `null` values with this option. If you set `type` to `"success"`, `"warning"` or `"alert"`, the notification banner sets `role` to `"alert"`. JavaScript then moves the keyboard focus to the notification banner when the page loads. If you do not set `type`, the notification banner sets `role` to `"region"`.
  - name: role
    type: string
    required: false
    description: Overrides the value of the `role` attribute for the notification banner. Defaults to `"region"`. If you set `type` to `"success"`, `"warning"` or `"alert"`, `role` defaults to `"alert"`.
  - name: titleId
    type: string
    required: false
    description: The `id` for the banner title, and the `aria-labelledby` attribute in the banner. Defaults to `"govuk-notification-banner-title"`.
  - name: disableAutoFocus
    type: boolean
    required: false
    description: If you set `type` to `"success"`, `"warning"` or `"alert"`, or `role` to `"alert"`, JavaScript moves the keyboard focus to the notification banner when the page loads. To disable this behaviour, set `disableAutoFocus` to `true`.
  - name: actionHtml
    type: string
    required: false
    description: HTML pre pravý stĺpec (tlačidlá alebo linky). Zobrazí sa v dedikovanej Grid zóne.
  - name: classes
    type: string
    required: false
    description: The classes that you want to add to the notification banner.
  - name: attributes
    type: object
    required: false
    description: The HTML attributes that you want to add to the notification banner, for example, data attributes.

title: Informačný banner

examples:
  - name: '- informačný typ'
    options:
      titleText: 'V zhrnutí sa vyžaduje nahrať prílohu'
      text: 'Pre rýchlejšie a efektívnejšie vybavenie žiadosti sa odporúča priložiť aj doklad o ukončení štúdia (napr. vysvedčenie o vykonaní záverečnej skúšky, maturitné vysvedčenie, vysokoškolský diplom a pod.)'
      actionHtml: '<a href="#" class="govuk-link">Akcia</a>'

  - name: '- varovný typ'
    options:
      type: alert
      titleText: 'Vyhľadávanie v schránke nebolo úspešné '
      text: 'Skúste zadať iné kritéria alebo znova spustiť vyhľadávanie.'
      html: '<a href="#" class="govuk-link">Toto je ukážka hypertextového odkazu</a>.'
      actionHtml: '<a href="#" class="govuk-link">Akcia</a>'

  - name: '- upozorňovací typ'
    options:
      type: warning
      titleText: 'Prílohy k elektronickej žiadosti'
      text: 'V prípade, že prílohy nenahráte v tejto žiadosti, je potrebné ich doložiť dodatočne (elektronicky alebo osobne). Požadované prílohy sú nevyhnutné k vyriešeniu vašej žiadosti.'
      actionHtml: '<a href="#" class="govuk-link">Akcia</a>'

  - name: '- úspešný typ'
    options:
      type: success
      titleText: 'Ste prihlásený'
      text: 'Teraz môžete pokračovať vo vašej žiadosti.'
      html: '<a href="#" class="govuk-link">Toto je ukážka hypertextového odkazu</a>.'
      actionHtml: '<a href="#" class="govuk-link">Akcia</a>'

  - name: '- s pokročilým HTML obsahom (zoznam)'
    options:
      type: alert
      titleText: 'Na stránke sa našli chyby'
      html: '<p class="govuk-body">Pred pokračovaním musíte opraviť nasledujúce chyby:</p><ul class="govuk-list govuk-list--bullet"><li><a href="#meno" class="govuk-link">Meno a priezvisko nesmie ostať prázdne</a></li><li><a href="#vek" class="govuk-link">Vek musí byť zadaný ako číslo</a></li></ul>'

  - name: '- menšia verzia'
    options:
      isSmall: true
      titleText: 'Nadpis informačného banneru'
      text: 'Telo textu informácie: Lorem ipsum dolor sit amet consectetur. Ipsum diam proin ultricies amet. Gravida rhoncus ultricies odio sed molestie neque. Lacus sit congue consequat convallis ut etiam massa vulputate aenean.'
      actionHtml: '<a href="#" class="govuk-link">Viac info</a>'
